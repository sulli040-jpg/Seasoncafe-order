<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="카페발주">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23FFB6C8'/><text y='.9em' font-size='80' x='10'>🐷</text></svg>">
<title>카페 발주</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
:root{
  --bg:#F7F5F0;--card:#fff;--primary:#2C2C2C;--accent:#C07B4A;
  --muted:#9A8F85;--border:#E5DDD5;
  --need:#D94F4F;--need-light:#FFF0F0;--need-border:#F0BEBE;
  --done:#3B6B5A;--done-light:#EEF5F2;--done-border:#A8CCC3;
  --complete:#F0F7F4;--tab-h:60px;--nav-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--primary);min-height:100vh;padding-bottom:calc(var(--tab-h) + 10px);}

/* ── TOP NAV ── */
.topnav{position:sticky;top:0;z-index:200;background:rgba(247,245,240,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.topnav-inner{display:flex;align-items:center;padding:0 4px;height:var(--nav-h);}
.back-btn{display:none;align-items:center;gap:2px;color:var(--accent);font-size:15px;font-weight:600;background:none;border:none;font-family:inherit;cursor:pointer;padding:8px 10px;min-width:60px;}
.back-btn.show{display:flex;}
.back-arrow{font-size:20px;line-height:1;}
.nav-title{flex:1;text-align:center;font-size:16px;font-weight:700;letter-spacing:-.01em;}
.nav-right{min-width:60px;display:flex;justify-content:flex-end;align-items:center;gap:4px;}
.icon-btn{background:none;border:none;font-size:18px;cursor:pointer;padding:6px;position:relative;}
.badge{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--need);display:none;}
.badge.show{display:block;}

/* chips */
.chips-bar{padding:6px 14px 10px;display:flex;gap:6px;flex-wrap:wrap;}
.chip{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:500;color:var(--muted);display:flex;gap:4px;cursor:pointer;transition:all .15s;}
.chip span{font-weight:700;color:var(--primary);}
.chip.need span{color:var(--need);}
.chip.done span{color:var(--done);}
.chip.need.active-filter{background:var(--need);border-color:var(--need);}
.chip.need.active-filter span,.chip.need.active-filter{color:#fff;}
.chip.done.active-filter{background:var(--done);border-color:var(--done);}
.chip.done.active-filter span,.chip.done.active-filter{color:#fff;}

/* filter page */
.filter-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;}
.filter-section{margin-bottom:16px;}
.filter-cat-name{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;padding:0 2px;display:flex;align-items:center;gap:6px;}
.filter-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);font-size:13px;font-weight:500;}
.filter-item:first-child{border-radius:12px 12px 0 0;}
.filter-item:last-child{border-radius:0 0 12px 12px;border-bottom:none;}
.filter-item:first-child:last-child{border-radius:12px;}
.filter-item-card{border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:4px;}
.filter-date{font-size:11px;font-weight:600;border-radius:4px;padding:2px 7px;}
.filter-date.need{background:var(--need-light);color:var(--need);border:1px solid var(--need-border);}
.filter-date.done{background:var(--done-light);color:var(--done);border:1px solid var(--done-border);}

/* sync */
.sync-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;background:var(--card);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;display:inline-block;margin-right:5px;transition:background .3s;}
.sync-dot.online{background:var(--done);}
.sync-dot.syncing{background:var(--accent);animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-reset{font-size:12px;color:var(--need);background:none;border:none;font-family:inherit;cursor:pointer;font-weight:600;}

/* recent */
.recent-bar{background:#FFF8F0;border-bottom:1px solid #F0DEC8;padding:10px 16px;display:none;}
.recent-bar.show{display:block;}
.recent-title{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.05em;margin-bottom:6px;}
.recent-item{display:flex;align-items:center;gap:8px;font-size:12px;background:#fff;border-radius:8px;padding:6px 10px;border:1px solid #F0DEC8;cursor:pointer;margin-bottom:4px;}
.rdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.recent-close{font-size:11px;color:var(--muted);text-align:right;cursor:pointer;font-weight:600;margin-top:4px;}

/* ── BOTTOM TAB BAR ── */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(247,245,240,.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;height:var(--tab-h);padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;background:none;border:none;font-family:inherit;font-size:10px;font-weight:600;color:var(--muted);transition:color .15s;padding:6px 0;}
.tab.active{color:var(--accent);}
.tab-icon{font-size:22px;line-height:1;}
.tab-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;margin-top:1px;}
.tab.active .tab-dot{opacity:1;}

/* ── PAGES ── */
.page{display:none;padding:14px 14px 20px;}
.page.active{display:block;}

/* home cat grid */
.home-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px;letter-spacing:.03em;}
.cat-grid{display:flex;flex-direction:column;gap:8px;}
.cat-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .12s;}
.cat-card:active{background:#F0EDE8;}
.cat-icon{font-size:22px;flex-shrink:0;}
.cat-info{flex:1;}
.cat-name{font-size:15px;font-weight:700;}
.cat-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.cat-badges{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
.cat-badge{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;}
.cat-badge.need{background:var(--need-light);color:var(--need);border:1px solid var(--need-border);}
.cat-badge.done{background:var(--done-light);color:var(--done);border:1px solid var(--done-border);}
.chevron{font-size:20px;color:var(--border);}

/* detail */
.detail-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:0 2px;}
.detail-icon{font-size:22px;}
.detail-name{font-size:17px;font-weight:700;}

.section{margin-bottom:18px;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;padding:0 2px;}
.sec-title{display:flex;align-items:center;gap:7px;}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sec-name{font-size:13px;font-weight:700;}
.sec-count{font-size:11px;color:var(--muted);}

.col-header{display:grid;grid-template-columns:1fr 70px 70px;gap:4px;padding:0 12px 4px;}
.col-label{font-size:10px;font-weight:700;text-align:center;line-height:1.3;}
.col-label.nl{color:var(--need);}
.col-label.dl{color:var(--done);}

.card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;}

.item{display:grid;grid-template-columns:1fr 70px 70px;gap:4px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border);transition:background .12s;}
.item:last-child{border-bottom:none;}
.item.fully-done{background:var(--complete);}
.item.highlight{animation:flash 1.5s ease;}
@keyframes flash{0%{background:#FFF3CD}100%{background:transparent}}

.item-left{display:flex;align-items:center;gap:6px;}
.item-name{font-size:13px;font-weight:500;line-height:1.3;}
.item.fully-done .item-name{color:#7BAF9E;text-decoration:line-through;text-decoration-color:#7BAF9E;}
.del-btn{background:none;border:none;color:#ccc;font-size:16px;cursor:pointer;padding:2px 4px;line-height:1;flex-shrink:0;display:none;}
.edit-mode .del-btn{display:block;}

.dcell{display:flex;flex-direction:column;align-items:center;gap:3px;}
.dchk{width:24px;height:24px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.dchk svg{opacity:0;transition:opacity .1s;}
.dcell.need .dchk{border-color:var(--need-border);}
.dcell.need.active .dchk{background:var(--need);border-color:var(--need);}
.dcell.need.active .dchk svg{opacity:1;}
.dcell.boss .dchk{border-color:var(--done-border);}
.dcell.boss.active .dchk{background:var(--done);border-color:var(--done);}
.dcell.boss.active .dchk svg{opacity:1;}
.dtag{font-size:10px;font-weight:600;border-radius:4px;padding:1px 4px;text-align:center;white-space:nowrap;min-width:42px;line-height:1.4;cursor:pointer;}
.dcell.need .dtag{background:var(--need-light);color:var(--need);border:1px solid var(--need-border);}
.dcell.boss .dtag{background:var(--done-light);color:var(--done);border:1px solid var(--done-border);}
.dtag.empty{opacity:0;pointer-events:none;}

/* add/edit row */
.card-footer{border-top:1px dashed var(--border);}
.add-btn-row{display:flex;align-items:center;gap:6px;padding:8px 12px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:500;background:#FAFAF8;}
.add-btn-row:active{background:#F0EDE8;}
.plus{font-size:15px;color:var(--accent);}
.add-input-row{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#FFFDF9;}
.add-input{flex:1;border:1.5px solid var(--border);border-radius:7px;padding:6px 9px;font-size:13px;font-family:inherit;outline:none;background:#fff;min-width:0;}
.add-input:focus{border-color:var(--accent);}
.add-ok{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 11px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;}
.add-cancel{background:none;color:var(--muted);border:1.5px solid var(--border);border-radius:7px;padding:6px 8px;font-size:12px;font-family:inherit;cursor:pointer;}

/* edit toggle */
.edit-toggle{font-size:12px;font-weight:600;color:var(--accent);background:none;border:none;font-family:inherit;cursor:pointer;padding:6px 8px;}

/* legend */
.legend{display:flex;justify-content:center;gap:16px;padding:6px 0 14px;font-size:12px;font-weight:600;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:5px;}
.ldot{width:9px;height:9px;border-radius:2px;display:inline-block;}

/* toast */
.toast{position:fixed;bottom:calc(var(--tab-h) + 12px);left:50%;transform:translateX(-50%);background:#2C2C2C;color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;}

/* undo */
.undo-bar{position:fixed;bottom:calc(var(--tab-h) + 10px);left:50%;transform:translateX(-50%);background:#2C2C2C;color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:500;z-index:998;display:none;align-items:center;gap:14px;white-space:nowrap;}
.undo-bar.show{display:flex;}
.undo-btn{color:#FFD700;font-weight:700;background:none;border:none;font-family:inherit;font-size:13px;cursor:pointer;}

/* loading */
.loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:14px;color:var(--muted);}

/* ── THEMES ── */

body.theme-pig{
  --bg:#FFF0F5;--card:#fff;--primary:#3D1A28;--accent:#E87FA0;
  --muted:#C4929F;--border:#F9D0DF;
  --need:#E84875;--need-light:#FFF0F5;--need-border:#F9B0C8;
  --done:#E87FA0;--done-light:#FFF0F5;--done-border:#F4B8CB;
  --complete:#FFF5F8;
}
body.theme-pig .topnav{background:rgba(255,240,245,.97);}
body.theme-pig .tabbar{background:rgba(255,240,245,.97);}

body.theme-pigdark{
  --bg:#2A1020;--card:#3A1830;--primary:#FFD6E8;--accent:#F4A7B9;
  --muted:#A07080;--border:#5A2840;
  --need:#FF6B9D;--need-light:#3A1030;--need-border:#6B2040;
  --done:#F4A7B9;--done-light:#2A1828;--done-border:#6B3050;
  --complete:#2A1828;
}
body.theme-pigdark .topnav{background:rgba(42,16,32,.97);}
body.theme-pigdark .tabbar{background:rgba(42,16,32,.97);}
body.theme-pigdark .loading{background:#2A1020;}

body.theme-dark{
  --bg:#1C1C1E;--card:#2C2C2E;--primary:#F5F5F5;--accent:#E8956B;
  --muted:#8E8E93;--border:#3A3A3C;
  --need:#FF6B6B;--need-light:#3A1A1A;--need-border:#6B2A2A;
  --done:#5AC8A0;--done-light:#1A3A2A;--done-border:#2A6B4A;
  --complete:#1A2E26;
}
body.theme-pastel{
  --bg:#FFF5F8;--card:#fff;--primary:#3D2C35;--accent:#E8829A;
  --muted:#B8909A;--border:#F0D5DC;
  --need:#E8829A;--need-light:#FFF0F3;--need-border:#F5C0CC;
  --done:#82C4B8;--done-light:#EEF8F5;--done-border:#B0DDD6;
  --complete:#EEF8F5;
}
body.theme-mono{
  --bg:#F5F5F5;--card:#fff;--primary:#1A1A1A;--accent:#444;
  --muted:#888;--border:#DDD;
  --need:#333;--need-light:#F0F0F0;--need-border:#BBB;
  --done:#555;--done-light:#EBEBEB;--done-border:#CCC;
  --complete:#EBEBEB;
}
body.theme-green{
  --bg:#F0F7F2;--card:#fff;--primary:#1A3A2A;--accent:#2E7D52;
  --muted:#6A9A7A;--border:#C8E0D0;
  --need:#D94F4F;--need-light:#FFF0F0;--need-border:#F0BEBE;
  --done:#2E7D52;--done-light:#E8F5EE;--done-border:#9ACFB2;
  --complete:#E8F5EE;
}

/* ── SETTINGS PAGE ── */
.settings-section{margin-bottom:20px;}
.settings-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;padding:0 4px;letter-spacing:.04em;}
.settings-card{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;}
.settings-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.settings-row:last-child{border-bottom:none;}
.settings-row:active{background:var(--bg);}
.settings-icon{font-size:18px;width:24px;text-align:center;}
.settings-text{flex:1;font-size:14px;font-weight:500;}
.settings-chevron{color:var(--border);font-size:18px;}

/* theme grid */
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
.theme-option{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;transition:all .15s;position:relative;}
.theme-option.active{border-color:var(--accent);}
.theme-option:active{opacity:.8;}
.theme-check{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);display:none;align-items:center;justify-content:center;color:#fff;font-size:12px;}
.theme-option.active .theme-check{display:flex;}
.theme-preview{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.theme-preview-bar{height:10px;border-radius:4px;}
.theme-name{font-size:12px;font-weight:700;text-align:center;}
.theme-sub{font-size:10px;color:var(--muted);text-align:center;margin-top:2px;}
</style>
</head>
<body>

<div class="loading" id="loading"><div class="spinner"></div><p>불러오는 중...</p></div>

<!-- TOP NAV -->
<div class="topnav">
  <div class="topnav-inner">
    <button class="back-btn" id="backBtn" onclick="goBack()"><span class="back-arrow">‹</span>뒤로</button>
    <div class="nav-title" id="navTitle">☕ 카페 발주</div>
    <div class="nav-right">
      <button class="icon-btn" onclick="toggleNotif()" id="notifBtn" title="알림">🔔<div class="badge" id="notifBadge"></div></button>
      <button class="icon-btn" onclick="toggleRecent()" title="최근변경">📋</button>
      <button class="icon-btn" onclick="openSettings()" title="설정">⚙️</button>
    </div>
  </div>
  <div class="chips-bar">
    <div class="chip need" id="chipNeed" onclick="toggleFilter('need')">🔴 발주요망 <span id="needCount">0</span></div>
    <div class="chip done" id="chipDone" onclick="toggleFilter('done')">🟢 발주완료 <span id="doneCount">0</span></div>
    <div class="chip" id="chipAll" onclick="toggleFilter(null)">전체 <span id="totalCount">0</span></div>
  </div>
</div>

<!-- SYNC -->
<div class="sync-bar">
  <div><span class="sync-dot" id="syncDot"></span><span id="syncText">연결 중...</span></div>
  <button class="btn-reset" onclick="resetAll()">전체 초기화</button>
</div>

<!-- RECENT -->
<div class="recent-bar" id="recentBar">
  <div class="recent-title">🔔 최근 변경사항</div>
  <div id="recentList"></div>
  <div class="recent-close" onclick="closeRecent()">✓ 확인했어요</div>
</div>

<!-- PAGES -->
<div id="page-home" class="page active">
  <div class="legend">
    <span><div class="ldot" style="background:var(--need)"></div>발주요망(직원)</span>
    <span><div class="ldot" style="background:var(--done)"></div>발주완료(사장님)</span>
  </div>
  <div class="home-label" id="homeLabel">카테고리 선택</div>
  <div class="cat-grid" id="catGrid"></div>
</div>

<div id="page-detail" class="page">
  <div id="detailContent"></div>
</div>

<div id="page-filter" class="page">
  <div id="filterContent"></div>
</div>

<div id="page-settings" class="page">
  <div class="settings-section">
    <div class="settings-label">디스플레이</div>
    <div class="settings-card">
      <div class="settings-row" onclick="openThemes()">
        <div class="settings-icon">🎨</div>
        <div class="settings-text">테마 변경</div>
        <div class="settings-chevron">›</div>
      </div>
    </div>
  </div>
  <div class="settings-section">
    <div class="settings-label">데이터</div>
    <div class="settings-card">
      <div class="settings-row" onclick="resetAll()">
        <div class="settings-icon">🗑</div>
        <div class="settings-text" style="color:var(--need)">전체 초기화</div>
        <div class="settings-chevron">›</div>
      </div>
    </div>
  </div>
  <div class="settings-section">
    <div class="settings-label">알림</div>
    <div class="settings-card">
      <div class="settings-row" onclick="toggleNotif()">
        <div class="settings-icon">🔔</div>
        <div class="settings-text">알림 설정</div>
        <div class="settings-chevron" id="notifStatus">끔</div>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin-top:30px;font-size:11px;color:var(--muted);">☕ 카페 발주 앱</div>
</div>

<div id="page-themes" class="page">
  <div class="settings-label" style="margin-bottom:12px">테마를 선택하세요</div>
  <div class="theme-grid" id="themeGrid"></div>
</div>

<!-- BOTTOM TAB BAR -->
<div class="tabbar">
  <button class="tab active" id="tab-hall" onclick="switchTab('hall')">
    <div class="tab-icon">🏠</div>
    <div>홀</div>
    <div class="tab-dot"></div>
  </button>
  <button class="tab" id="tab-baking" onclick="switchTab('baking')">
    <div class="tab-icon">🎂</div>
    <div>베이킹</div>
    <div class="tab-dot"></div>
  </button>
  <button class="tab" id="tab-all" onclick="switchTab('all')">
    <div class="tab-icon">📋</div>
    <div>전체</div>
    <div class="tab-dot"></div>
  </button>
</div>

<div class="toast" id="toast"></div>

let cats = JSON.parse(JSON.stringify(DEFAULT_CATS));
let state = {};

let isFirstLoad = true;
let prevState = {};
let currentTab = "hall";
let currentCatId = null;
let addingKey = null;
let editMode = false;
let undoStack = null;

const CHECK_SVG = `<svg width="11" height="9" viewBox="0 0 13 10" fill="none"><path d="M1.5 5L5 8.5L11.5 1.5" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function todayStr(){const d=new Date();return `${d.getMonth()+1}/${d.getDate()}`;}
function nowStr(){const d=new Date();return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;}
function getKey(catId,si,item){return `${catId}__${si}__${item.replace(/[\s\/·\(\)\.]/g,'_')}`;}

function setSyncStatus(s){
  const dot=document.getElementById('syncDot'),txt=document.getElementById('syncText');
  if(s==='online'){dot.className='sync-dot online';txt.textContent='실시간 연결됨';}
  else if(s==='syncing'){dot.className='sync-dot syncing';txt.textContent='저장 중...';}
  else{dot.className='sync-dot';txt.textContent='연결 중...';}
}

let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    setSyncStatus('syncing');
    setDoc(STATE_REF,{state,cats}).then(()=>setSyncStatus('online')).catch(console.error);
  },500);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);
}

// ── Undo ──
function showUndo(msg,snapshot){
  clearTimeout(undoTimer);
  undoStack=snapshot;
  document.getElementById('undoMsg').textContent=msg;
  document.getElementById('undoBar').classList.add('show');
  undoTimer=setTimeout(()=>{document.getElementById('undoBar').classList.remove('show');undoStack=null;},4000);
}
window.doUndo=function(){
  if(!undoStack)return;
  state=JSON.parse(JSON.stringify(undoStack));
  scheduleSave();renderAll();
  document.getElementById('undoBar').classList.remove('show');undoStack=null;
  showToast('↩ 되돌렸어요');
};

// ── Notifications ──
window.toggleNotif=function(){
  if(!notifEnabled){
    if('Notification' in window){
      Notification.requestPermission().then(p=>{
        if(p==='granted'){notifEnabled=true;showToast('🔔 알림 켜짐!');}
        else showToast('설정 > Safari > 알림 허용 필요');
      });
    } else showToast('이 브라우저는 알림 미지원');
  } else {notifEnabled=false;showToast('🔕 알림 꺼짐');}
};
function sendNotif(title,body){
  if(notifEnabled&&Notification.permission==='granted') new Notification(title,{body,icon:'☕'});
  document.getElementById('notifBadge').classList.add('show');
}

// ── Recent ──
window.toggleRecent=function(){
  const bar=document.getElementById('recentBar');
  bar.classList.toggle('show');
  if(bar.classList.contains('show'))renderRecent();
};
window.closeRecent=function(){
  document.getElementById('recentBar').classList.remove('show');
  document.getElementById('notifBadge').classList.remove('show');
  recentChanges=[];renderRecent();
};
function addRecentChange(itemName,field,checked){
  const label=field==='need'?'발주요망':'발주완료';
  recentChanges.unshift({itemName,label,action:checked?'체크':'해제',time:nowStr()});
  if(recentChanges.length>20)recentChanges.pop();
  document.getElementById('recentBar').classList.add('show');
  renderRecent();
  sendNotif('카페 발주 변경',`${itemName} — ${label} ${checked?'체크':'해제'}됨`);
  showToast(`${field==='need'?'🔴':'🟢'} ${itemName} ${checked?'체크':'해제'}`);
}
function renderRecent(){
  const list=document.getElementById('recentList');
  if(!recentChanges.length){list.innerHTML='<div style="font-size:12px;color:var(--muted);padding:4px 0">변경사항 없음</div>';return;}
  list.innerHTML=recentChanges.slice(0,8).map(c=>`
    <div class="recent-item" onclick="jumpToItem('${c.itemName.replace(/'/g,"\\'")}')">
      <div class="rdot" style="background:${c.label==='발주요망'?'var(--need)':'var(--done)'}"></div>
      <span><b>${c.itemName}</b> ${c.label} ${c.action}</span>
      <span style="margin-left:auto;color:var(--muted);font-size:10px">${c.time}</span>
    </div>`).join('');
}
window.jumpToItem=function(name){
  for(const cat of cats){
    for(let si=0;si<cat.sections.length;si++){
      if(cat.sections[si].items.includes(name)){
        closeRecent();
        currentTab=cat.tab;updateTabBar();
        openCat(cat.id);
        setTimeout(()=>{
          const els=document.querySelectorAll('.item-name');
          for(const el of els){
            if(el.textContent===name){
              el.closest('.item').scrollIntoView({behavior:'smooth',block:'center'});
              el.closest('.item').classList.add('highlight');
              setTimeout(()=>el.closest('.item').classList.remove('highlight'),1600);
              break;
            }
          }
        },300);return;
      }
    }
  }
};

// ── Tab ──
window.switchTab=function(tab){
  currentTab=tab;currentCatId=null;editMode=false;
  showPage('home');updateTabBar();renderHome();
  document.getElementById('backBtn').classList.remove('show');
  document.getElementById('navTitle').textContent='☕ 카페 발주';
};
function updateTabBar(){
  ['hall','baking','all'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===currentTab);
  });
}

// ── Navigation ──
window.goBack=function(){
  currentCatId=null;editMode=false;addingKey=null;
  activeFilter=null;
  document.getElementById('chipNeed').classList.remove('active-filter');
  document.getElementById('chipDone').classList.remove('active-filter');
  showPage('home');renderHome();
  document.getElementById('backBtn').classList.remove('show');
  document.getElementById('navTitle').textContent='☕ 카페 발주';
};
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
}
function openCat(catId){
  currentCatId=catId;editMode=false;addingKey=null;
  const cat=cats.find(c=>c.id===catId);
  document.getElementById('navTitle').textContent=cat?`${cat.icon} ${cat.name}`:'';
  document.getElementById('backBtn').classList.add('show');
  showPage('detail');renderDetail();
}
window.openCat=openCat;

// ── Stats ──
function getCatStats(cat){
  let need=0,done=0,total=0;
  cat.sections.forEach((sec,si)=>{
    sec.items.forEach(item=>{
      const k=getKey(cat.id,si,item);
      if(!state[k])state[k]={need:false,needDate:'',boss:false,bossDate:''};
      if(state[k].need)need++;if(state[k].boss)done++;total++;
    });
  });
  return{need,done,total};
}
function getAllStats(){
  let need=0,done=0,total=0;
  cats.forEach(cat=>{const s=getCatStats(cat);need+=s.need;done+=s.done;total+=s.total;});
  return{need,done,total};
}

// ── Render home ──
function renderHome(){
  const{need,done,total}=getAllStats();
  document.getElementById('needCount').textContent=need;
  document.getElementById('doneCount').textContent=done;
  document.getElementById('totalCount').textContent=total;

  const filtered=currentTab==='all'?cats:cats.filter(c=>c.tab===currentTab);
  document.getElementById('homeLabel').textContent=
    currentTab==='hall'?'홀 카테고리':currentTab==='baking'?'베이킹 카테고리':'전체 카테고리';

  const grid=document.getElementById('catGrid');
  grid.innerHTML='';
  filtered.forEach(cat=>{
    const{need:n,done:d,total:t}=getCatStats(cat);
    const el=document.createElement('div');
    el.className='cat-card';el.onclick=()=>openCat(cat.id);
    el.innerHTML=`
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-info">
        <div class="cat-name">${cat.name}</div>
        <div class="cat-sub">${t}개 항목</div>
        ${n||d?`<div class="cat-badges">
          ${n?`<span class="cat-badge need">🔴 발주요망 ${n}</span>`:''}
          ${d?`<span class="cat-badge done">🟢 완료 ${d}</span>`:''}
        </div>`:''}
      </div>
      <div class="chevron">›</div>`;
    grid.appendChild(el);
  });
}

// ── Render detail ──
function renderDetail(){
  const cat=cats.find(c=>c.id===currentCatId);if(!cat)return;
  const content=document.getElementById('detailContent');
  content.innerHTML='';
  content.className=editMode?'edit-mode':'';

  // header + edit toggle
  const hdr=document.createElement('div');
  hdr.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px;';
  hdr.innerHTML=`
    <div class="detail-header" style="margin-bottom:0">
      <span class="detail-icon">${cat.icon}</span>
      <span class="detail-name">${cat.name}</span>
    </div>
    <button class="edit-toggle" onclick="toggleEdit()">${editMode?'완료':'편집'}</button>`;
  content.appendChild(hdr);

  const leg=document.createElement('div');
  leg.className='legend';
  leg.innerHTML=`<span><div class="ldot" style="background:var(--need)"></div>발주요망(직원)</span><span><div class="ldot" style="background:var(--done)"></div>발주완료(사장님)</span>`;
  content.appendChild(leg);

  cat.sections.forEach((sec,si)=>{
    let needC=0,doneC=0;
    sec.items.forEach(item=>{
      const k=getKey(cat.id,si,item);
      if(!state[k])state[k]={need:false,needDate:'',boss:false,bossDate:''};
      if(state[k].need)needC++;if(state[k].boss)doneC++;
    });

    const secEl=document.createElement('div');secEl.className='section';
    secEl.innerHTML=`
      <div class="section-header">
        <div class="sec-title"><div class="sdot" style="background:${cat.color}"></div><div class="sec-name">${sec.name}</div></div>
        <div class="sec-count">발주요망 ${needC} · 완료 ${doneC}</div>
      </div>
      <div class="col-header">
        <div></div>
        <div class="col-label nl">🔴 발주요망<br><span style="font-weight:400;font-size:9px">직원 체크</span></div>
        <div class="col-label dl">🟢 발주완료<br><span style="font-weight:400;font-size:9px">사장님 체크</span></div>
      </div>
      <div class="card ${editMode?'edit-mode':''}" id="card-${cat.id}-${si}"></div>`;
    content.appendChild(secEl);

    const card=document.getElementById(`card-${cat.id}-${si}`);
    sec.items.forEach((item,ii)=>{
      const k=getKey(cat.id,si,item);
      const s=state[k];const fullyDone=s.need&&s.boss;
      const el=document.createElement('div');
      el.className='item'+(fullyDone?' fully-done':'');
      el.innerHTML=`
        <div class="item-left">
          <button class="del-btn" onclick="deleteItem('${cat.id}',${si},${ii})" title="삭제">✕</button>
          <div class="item-name">${item}</div>
        </div>
        <div class="dcell need ${s.need?'active':''}" data-key="${k}" data-field="need">
          <div class="dchk">${CHECK_SVG}</div>
          <div class="dtag ${s.needDate?'':'empty'}" data-key="${k}" data-df="needDate">${s.needDate||'날짜'}</div>
        </div>
        <div class="dcell boss ${s.boss?'active':''}" data-key="${k}" data-field="boss">
          <div class="dchk">${CHECK_SVG}</div>
          <div class="dtag ${s.bossDate?'':'empty'}" data-key="${k}" data-df="bossDate">${s.bossDate||'날짜'}</div>
        </div>`;
      el.querySelectorAll('.dcell').forEach(cell=>{
        cell.addEventListener('click',e=>{
          if(editMode)return;
          if(e.target.classList.contains('dtag')&&!e.target.classList.contains('empty'))return;
          const snapshot=JSON.parse(JSON.stringify(state));
          const k2=cell.dataset.key,f=cell.dataset.field;
          if(!state[k2])state[k2]={need:false,needDate:'',boss:false,bossDate:''};
          const newVal=!state[k2][f];
          state[k2][f]=newVal;state[k2][f+'Date']=newVal?todayStr():'';
          scheduleSave();
          showUndo(`${item} ${f==='need'?'발주요망':'발주완료'} ${newVal?'체크':'해제'}`,snapshot);
          renderDetail();renderHome();
        });
      });
      el.querySelectorAll('.dtag:not(.empty)').forEach(tag=>{
        tag.addEventListener('click',e=>{
          if(editMode)return;
          e.stopPropagation();
          const cur=state[tag.dataset.key]?.[tag.dataset.df]||'';
          const val=prompt('날짜 입력 (예: 6/15)',cur);
          if(val===null)return;
          state[tag.dataset.key][tag.dataset.df]=val.trim();
          scheduleSave();renderDetail();
        });
      });
      card.appendChild(el);
    });

    // add/input row
    const addKey=`${cat.id}-${si}`;
    const footer=document.createElement('div');footer.className='card-footer';
    if(addingKey===addKey){
      footer.innerHTML=`<div class="add-input-row"><input id="add-in-${addKey}" class="add-input" type="text" placeholder="항목 이름..."><button class="add-cancel" onclick="window._cancelAdd()">취소</button><button class="add-ok" onclick="window._confirmAdd('${cat.id}',${si})">추가</button></div>`;
      footer.querySelector('input').addEventListener('keydown',e=>{if(e.key==='Enter')window._confirmAdd(cat.id,si);});
    } else {
      footer.innerHTML=`<div class="add-btn-row"><span class="plus">＋</span>항목 추가</div>`;
      footer.querySelector('.add-btn-row').onclick=()=>{addingKey=addKey;renderDetail();setTimeout(()=>document.getElementById(`add-in-${addKey}`)?.focus(),80);};
    }
    card.appendChild(footer);
  });

  // update counts
  const{need,done,total}=getAllStats();
  document.getElementById('needCount').textContent=need;
  document.getElementById('doneCount').textContent=done;
  document.getElementById('totalCount').textContent=total;
}

window.toggleEdit=function(){editMode=!editMode;addingKey=null;renderDetail();};

window.deleteItem=function(catId,si,ii){
  const cat=cats.find(c=>c.id===catId);if(!cat)return;
  const item=cat.sections[si].items[ii];
  if(!confirm(`"${item}" 항목을 삭제할까요?`))return;
  cat.sections[si].items.splice(ii,1);
  scheduleSave();renderDetail();renderHome();
  showToast(`🗑 "${item}" 삭제됨`);
};

window._cancelAdd=function(){addingKey=null;renderDetail();};
window._confirmAdd=function(catId,si){
  const addKey=`${catId}-${si}`;
  const input=document.getElementById(`add-in-${addKey}`);
  const name=input?.value.trim();
  if(!name)return;
  const cat=cats.find(c=>c.id===catId);
  if(cat.sections[si].items.includes(name)){showToast('이미 있는 항목이에요');return;}
  cat.sections[si].items.push(name);
  addingKey=null;scheduleSave();renderDetail();renderHome();
  showToast(`✅ "${name}" 추가됐어요!`);
};

window.resetAll=function(){
  if(!confirm('전체 초기화할까요?\n모든 체크가 사라져요.'))return;
  const snapshot=JSON.parse(JSON.stringify(state));
  state={};scheduleSave();renderAll();
  showUndo('전체 초기화됨',snapshot);
};


// ── Filter view ──
window.toggleFilter=function(type){
  if(activeFilter===type){
    activeFilter=null;
    document.getElementById('chipNeed').classList.remove('active-filter');
    document.getElementById('chipDone').classList.remove('active-filter');
    showPage('home');renderHome();
    document.getElementById('backBtn').classList.remove('show');
    document.getElementById('navTitle').textContent='☕ 카페 발주';
    return;
  }
  activeFilter=type;
  document.getElementById('chipNeed').classList.toggle('active-filter', type==='need');
  document.getElementById('chipDone').classList.toggle('active-filter', type==='done');
  if(type===null){
    showPage('home');renderHome();
    document.getElementById('backBtn').classList.remove('show');
    document.getElementById('navTitle').textContent='☕ 카페 발주';
    return;
  }
  currentCatId=null;editMode=false;
  const label=type==='need'?'🔴 발주요망':'🟢 발주완료';
  document.getElementById('navTitle').textContent=label;
  document.getElementById('backBtn').classList.add('show');
  showPage('filter');
  renderFilter();
};

function renderFilter(){
  const content=document.getElementById('filterContent');
  content.innerHTML='';
  const field=activeFilter;
  let found=false;

  cats.forEach(cat=>{
    const matchItems=[];
    cat.sections.forEach((sec,si)=>{
      sec.items.forEach(item=>{
        const k=getKey(cat.id,si,item);
        if(!state[k])state[k]={need:false,needDate:'',boss:false,bossDate:''};
        const s=state[k];
        const show = field==="need" ? (s.need && !s.boss) : (s.boss);
        if(show){
          matchItems.push({item,k,sec,si,date:s[field+'Date']});
        }
      });
    });
    if(matchItems.length===0)return;
    found=true;

    const sec=document.createElement('div');
    sec.className='filter-section';
    sec.innerHTML=`<div class="filter-cat-name"><span>${cat.icon}</span>${cat.name}</div>`;
    const card=document.createElement('div');
    card.className='filter-item-card';
    matchItems.forEach(({item,k,date})=>{
      const row=document.createElement('div');
      row.className='filter-item';
      row.innerHTML=`
        <span>${item}</span>
        ${date?`<span class="filter-date ${field}">${date}</span>`:''}
      `;
      row.onclick=()=>jumpToItem(item);
      card.appendChild(row);
    });
    sec.appendChild(card);
    content.appendChild(sec);
  });

  if(!found){
    content.innerHTML=`<div class="filter-empty">${activeFilter==='need'?'🔴 발주요망':'🟢 발주완료'} 항목이 없어요</div>`;
  }
}

function renderAll(){if(activeFilter&&activeFilter!==null&&document.getElementById("page-filter").classList.contains("active"))renderFilter();else if(currentCatId)renderDetail();else renderHome();}

// ── Firestore ──
onSnapshot(STATE_REF,(snap)=>{
  document.getElementById('loading').style.display='none';
  setSyncStatus('online');
  if(snap.exists()){
    const data=snap.data();
    const newState=data.state||{};
    // Merge: start from DEFAULT_CATS, then add any user-added items from Firebase
    const savedCats=data.cats||[];
    const newCats=JSON.parse(JSON.stringify(DEFAULT_CATS));
    if(savedCats.length>0){
      newCats.forEach(defCat=>{
        const savedCat=savedCats.find(c=>c.id===defCat.id);
        if(savedCat){
          defCat.sections.forEach((defSec,si)=>{
            const savedSec=savedCat.sections&&savedCat.sections[si];
            if(savedSec&&savedSec.items){
              // Add user-added items not in default
              savedSec.items.forEach(item=>{
                if(!defSec.items.includes(item)) defSec.items.push(item);
              });
            }
          });
        }
      });
    }
    if(!isFirstLoad){
      Object.entries(newState).forEach(([k,val])=>{
        const prev=prevState[k]||{};
        ['need','boss'].forEach(f=>{
          if(val[f]!==prev[f]){
            let itemName=k.split('__')[2]?.replace(/_/g,' ')||k;
            cats.forEach(cat=>cat.sections.forEach((sec,si)=>sec.items.forEach(it=>{if(getKey(cat.id,si,it)===k)itemName=it;})));
            addRecentChange(itemName,f,val[f]);
          }
        });
      });
    }
    prevState=JSON.parse(JSON.stringify(newState));
    state=newState;cats=newCats;isFirstLoad=false;
  } else {isFirstLoad=false;}
  renderAll();
},(err)=>{
  document.getElementById('loading').style.display='none';
  setSyncStatus('offline');isFirstLoad=false;renderAll();
});

window.openThemes=function(){
  document.getElementById('navTitle').textContent='테마 변경';
  showPage('themes');
  renderThemes();
};

const THEMES = [
  { id:'default', name:'기본☕', sub:'카페 감성', colors:['#C07B4A','#E5DDD5','#3B6B5A'] },
  { id:'pig',     name:'🐷 피기', sub:'우리 카페 컨셉!', colors:['#F4A7B9','#FFE4EE','#E87FA0'] },
  { id:'pigdark', name:'🐷 다크피기', sub:'돼지도 야식 먹어요', colors:['#E87FA0','#3A2030','#F4A7B9'] },
  { id:'pastel',  name:'파스텔', sub:'사랑스러워요', colors:['#E8829A','#F0D5DC','#82C4B8'] },
  { id:'dark',    name:'다크', sub:'눈이 편해요', colors:['#E8956B','#3A3A3C','#5AC8A0'] },
  { id:'mono',    name:'모노', sub:'심플하게', colors:['#444','#DDD','#555'] },
];

let currentTheme = localStorage.getItem('cafe-theme') || 'default';

function applyTheme(id){
  document.body.className = id==='default' ? '' : 'theme-'+id;
  currentTheme=id;
  localStorage.setItem('cafe-theme',id);
  // Update title emoji
  const isPig = id==='pig'||id==='pigdark';
  document.querySelectorAll('.nav-title, #navTitle').forEach(el=>{
    if(el.textContent.includes('카페 발주')) el.textContent=(isPig?'🐷':'☕')+' 카페 발주';
  });
  // Update tab icons
  const hallTab=document.querySelector('#tab-hall .tab-icon');
  if(hallTab) hallTab.textContent=isPig?'🐷':'🏠';
}

function renderThemes(){
  const grid=document.getElementById('themeGrid');
  grid.innerHTML='';
  THEMES.forEach(t=>{
    const el=document.createElement('div');
    el.className='theme-option'+(currentTheme===t.id?' active':'');
    el.innerHTML=`
      <div class="theme-check">✓</div>
      <div class="theme-preview">
        <div class="theme-preview-bar" style="background:${t.colors[0]}"></div>
        <div class="theme-preview-bar" style="background:${t.colors[1]}"></div>
        <div class="theme-preview-bar" style="background:${t.colors[2]}"></div>
      </div>
      <div class="theme-name">${t.name}</div>
      <div class="theme-sub">${t.sub}</div>`;
    el.onclick=()=>{applyTheme(t.id);renderThemes();showToast('테마가 바뀌었어요!');};
    grid.appendChild(el);
  });
}

// Apply saved theme on load
applyTheme(currentTheme);

const now=new Date();
document.getElementById('navTitle').textContent='☕ 카페 발주';
switchTab('hall');
