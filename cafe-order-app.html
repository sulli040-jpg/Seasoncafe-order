<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="카페발주">
<title>카페 발주</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

  :root {
    --bg: #F7F5F0;
    --card: #FFFFFF;
    --primary: #2C2C2C;
    --accent: #C07B4A;
    --muted: #9A8F85;
    --border: #E5DDD5;
    --need-color: #D94F4F;
    --need-fill: #D94F4F;
    --need-light: #FFF0F0;
    --need-border: #F0BEBE;
    --done-color: #3B6B5A;
    --done-fill: #3B6B5A;
    --done-light: #EEF5F2;
    --done-border: #A8CCC3;
    --complete-row: #F0F7F4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--primary);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  .top-bar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(247,245,240,0.97);
    backdrop-filter: blur(10px);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .top-bar-row { display: flex; align-items: center; justify-content: space-between; }
  .top-bar h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .top-bar .date { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .summary-bar { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .summary-chip {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 12px;
    font-size: 12px; font-weight: 500; color: var(--muted);
    display: flex; align-items: center; gap: 4px;
  }
  .summary-chip span { font-weight: 700; color: var(--primary); }
  .summary-chip.need span { color: var(--need-color); }
  .summary-chip.done span { color: var(--done-color); }

  .sync-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  .sync-left { display: flex; align-items: center; gap: 8px; }
  .sync-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ccc; transition: background 0.3s;
  }
  .sync-dot.online { background: #3B6B5A; }
  .sync-dot.syncing { background: #C07B4A; animation: pulse 0.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Notification bell */
  .notif-btn {
    background: none; border: none; cursor: pointer;
    font-size: 18px; padding: 2px 6px; position: relative;
  }
  .notif-badge {
    position: absolute; top: 0; right: 2px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--need-color); display: none;
  }
  .notif-badge.show { display: block; }

  .btn-reset {
    font-size: 12px; color: var(--need-color);
    background: none; border: none; font-family: inherit;
    cursor: pointer; font-weight: 600;
  }

  /* Recent changes banner */
  .recent-bar {
    background: #FFF8F0; border-bottom: 1px solid #F0DEC8;
    padding: 10px 16px; display: none;
  }
  .recent-bar.show { display: block; }
  .recent-title {
    font-size: 11px; font-weight: 700; color: var(--accent);
    letter-spacing: 0.05em; margin-bottom: 6px;
  }
  .recent-list { display: flex; flex-direction: column; gap: 4px; }
  .recent-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--primary);
    background: white; border-radius: 8px; padding: 6px 10px;
    border: 1px solid #F0DEC8; cursor: pointer;
  }
  .recent-item:active { background: #FFF0E0; }
  .recent-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .recent-close {
    font-size: 11px; color: var(--muted); text-align: right;
    margin-top: 6px; cursor: pointer; font-weight: 600;
  }

  .content { padding: 16px 14px; }

  .section { margin-bottom: 24px; }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px; padding: 0 2px;
  }
  .section-title { display: flex; align-items: center; gap: 8px; }
  .section-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .section-name { font-size: 15px; font-weight: 700; }
  .section-count { font-size: 12px; color: var(--muted); font-weight: 500; }

  .col-header {
    display: grid;
    grid-template-columns: 1fr 86px 86px;
    gap: 6px; padding: 0 14px 6px;
  }
  .col-label { font-size: 11px; font-weight: 700; text-align: center; line-height: 1.3; }
  .col-label.need-label { color: var(--need-color); }
  .col-label.done-label { color: var(--done-color); }

  .card {
    background: var(--card); border-radius: 14px;
    border: 1px solid var(--border); overflow: hidden;
  }

  .item {
    display: grid;
    grid-template-columns: 1fr 86px 86px;
    gap: 6px; align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  .item:last-child { border-bottom: none; }
  .item.fully-done { background: var(--complete-row); }
  .item.highlight {
    animation: flashHighlight 1.5s ease;
  }
  @keyframes flashHighlight {
    0% { background: #FFF3CD; }
    100% { background: transparent; }
  }

  .item-name { font-size: 14px; font-weight: 500; line-height: 1.3; padding-right: 4px; }
  .item.fully-done .item-name { color: #7BAF9E; text-decoration: line-through; text-decoration-color: #7BAF9E; }

  .date-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .date-checkbox {
    width: 26px; height: 26px; border-radius: 7px;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s; flex-shrink: 0;
  }
  .date-checkbox svg { opacity: 0; transition: opacity 0.1s; }

  .date-cell.need .date-checkbox { border-color: var(--need-border); }
  .date-cell.need.active .date-checkbox { background: var(--need-fill); border-color: var(--need-fill); }
  .date-cell.need.active .date-checkbox svg { opacity: 1; }
  .date-cell.boss .date-checkbox { border-color: var(--done-border); }
  .date-cell.boss.active .date-checkbox { background: var(--done-fill); border-color: var(--done-fill); }
  .date-cell.boss.active .date-checkbox svg { opacity: 1; }

  .date-tag {
    font-size: 11px; font-weight: 600; border-radius: 5px; padding: 2px 5px;
    text-align: center; white-space: nowrap; min-width: 50px; line-height: 1.4; cursor: pointer;
  }
  .date-cell.need .date-tag { background: var(--need-light); color: var(--need-color); border: 1px solid var(--need-border); }
  .date-cell.boss .date-tag { background: var(--done-light); color: var(--done-color); border: 1px solid var(--done-border); }
  .date-tag.empty { opacity: 0; pointer-events: none; }

  /* Add item button per section */
  .add-item-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    color: var(--muted); font-size: 13px; font-weight: 500;
    cursor: pointer; border-top: 1px dashed var(--border);
    background: #FAFAF8; transition: background 0.12s;
  }
  .add-item-btn:hover { background: #F5F3EE; }
  .add-item-btn .plus { font-size: 16px; color: var(--accent); }

  /* Add item inline input */
  .add-item-input-row {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 14px; border-top: 1px solid var(--border);
    background: #FFFDF9;
  }
  .add-item-input {
    flex: 1; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 14px; font-family: inherit;
    outline: none; background: white;
  }
  .add-item-input:focus { border-color: var(--accent); }
  .add-confirm-btn {
    background: var(--accent); color: white; border: none;
    border-radius: 8px; padding: 7px 14px; font-size: 13px;
    font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .add-cancel-btn {
    background: none; color: var(--muted); border: 1.5px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 13px;
    font-family: inherit; cursor: pointer;
  }

  /* Toast notification */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: #2C2C2C; color: white; border-radius: 10px;
    padding: 10px 18px; font-size: 13px; font-weight: 500;
    z-index: 999; opacity: 0; transition: opacity 0.3s;
    white-space: nowrap; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* Loading */
  .loading {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; z-index: 999;
  }
  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { font-size: 14px; color: var(--muted); font-weight: 500; }

  .legend {
    display: flex; justify-content: center; gap: 16px;
    padding: 10px 0 0; font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .ldot { width: 9px; height: 9px; border-radius: 2px; }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>불러오는 중...</p>
</div>

<div class="top-bar">
  <div class="top-bar-row">
    <div>
      <h1>☕ 카페 발주</h1>
      <div class="date" id="dateDisplay"></div>
    </div>
    <button class="notif-btn" onclick="toggleNotif()" id="notifBtn">
      🔔
      <div class="notif-badge" id="notifBadge"></div>
    </button>
  </div>
  <div class="summary-bar">
    <div class="summary-chip need">발주요망 <span id="needCount">0</span>개</div>
    <div class="summary-chip done">발주완료 <span id="doneCount">0</span>개</div>
    <div class="summary-chip">전체 <span id="totalCount">0</span>개</div>
  </div>
</div>

<div class="sync-bar">
  <div class="sync-left">
    <span class="sync-dot" id="syncDot"></span>
    <span id="syncText">연결 중...</span>
  </div>
  <button class="btn-reset" onclick="resetAll()">전체 초기화</button>
</div>

<!-- Recent changes -->
<div class="recent-bar" id="recentBar">
  <div class="recent-title">🔔 최근 변경사항</div>
  <div class="recent-list" id="recentList"></div>
  <div class="recent-close" onclick="closeRecent()">닫기</div>
</div>

<div class="content">
  <div class="legend">
    <span><div class="ldot" style="background:var(--need-color)"></div> 발주요망 (직원)</span>
    <span><div class="ldot" style="background:var(--done-color)"></div> 발주완료 (사장님)</span>
  </div>
  <br>
  <div id="sections"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKXC8ja_QQY3jT-sEH-UcxFeGppAv37Rc",
  authDomain: "season-order.firebaseapp.com",
  projectId: "season-order",
  storageBucket: "season-order.firebasestorage.app",
  messagingSenderId: "713136334900",
  appId: "1:713136334900:web:7e6962501e4b82ab39c261"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const DOC_REF = doc(db, "checklist", "main");

// Default sections
const defaultSections = [
  {
    name: "홀 일회용품", color: "#3B6B5A",
    items: ["냅킨","화장실 휴지","물티슈","빨대","스무디 빨대","종이컵","Hot 컵","Hot 컵 뚜껑","ICE 컵","ICE 컵 뚜껑","컵홀더","포크","나이프","음료 1구","음료 2구","비닐봉투 소","비닐봉투 중","비닐봉투 대","비닐장갑","종이박스 소","종이박스 대","종이봉투 소","종이봉투 대","배달음료 종이","유산지","두쫀쿠 포장지","버터바 포장지","휘낭시에 포장지","노란색 테이프","테이프","고무장갑","행주"]
  },
  {
    name: "재료", color: "#7A4F35",
    items: ["우유","탄산수","사이다","애사비","우지말차","말차파우더","코코아파우더","빅트레인","가라델리 초코","요거트 파우더","슈가시럽","캐모마일","패퍼민트","애로스","후지야마","얼그레이","원두","레몬","자몽","패션후르츠","자몽원액","냉동 블루베리","냉동딸기","바닐라아이스크림","초코아이스크림","연유","딸기잼","블루베리잼","생강청"]
  }
];

let state = {};
let sections = JSON.parse(JSON.stringify(defaultSections));
let recentChanges = [];
let notifEnabled = false;
let isFirstLoad = true;
let addingSection = null; // which section is showing input

const CHECK_SVG = `<svg width="12" height="9" viewBox="0 0 13 10" fill="none"><path d="M1.5 5L5 8.5L11.5 1.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function todayStr() {
  const d = new Date();
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function nowStr() {
  const d = new Date();
  return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function getKey(si, item) { return `${si}__${item.replace(/[\s\/]/g,'_')}`; }

function setSyncStatus(s) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if (s === 'online') { dot.className='sync-dot online'; txt.textContent='실시간 연결됨'; }
  else if (s === 'syncing') { dot.className='sync-dot syncing'; txt.textContent='저장 중...'; }
  else { dot.className='sync-dot'; txt.textContent='연결 중...'; }
}

async function saveToFirebase() {
  setSyncStatus('syncing');
  try {
    await setDoc(DOC_REF, { state, sections });
    setSyncStatus('online');
  } catch(e) { console.error(e); }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Notification
window.toggleNotif = function() {
  if (!notifEnabled) {
    if ('Notification' in window) {
      Notification.requestPermission().then(p => {
        if (p === 'granted') {
          notifEnabled = true;
          showToast('🔔 알림이 켜졌어요!');
          document.getElementById('notifBtn').textContent = '🔕';
          document.getElementById('notifBtn').insertAdjacentHTML('beforeend', '<div class="notif-badge" id="notifBadge"></div>');
        } else {
          showToast('알림 권한이 필요해요');
        }
      });
    } else {
      showToast('이 브라우저는 알림을 지원하지 않아요');
    }
  } else {
    notifEnabled = false;
    showToast('🔕 알림이 꺼졌어요');
    document.getElementById('notifBtn').textContent = '🔔';
    document.getElementById('notifBtn').insertAdjacentHTML('beforeend', '<div class="notif-badge" id="notifBadge"></div>');
  }
}

function sendNotif(title, body) {
  if (notifEnabled && Notification.permission === 'granted') {
    new Notification(title, { body, icon: '☕' });
  }
  // Also show badge
  document.getElementById('notifBadge')?.classList.add('show');
}

// Recent changes
window.closeRecent = function() {
  document.getElementById('recentBar').classList.remove('show');
  document.getElementById('notifBadge')?.classList.remove('show');
}

function addRecentChange(itemName, field, checked) {
  const label = field === 'need' ? '발주요망' : '발주완료';
  const action = checked ? '✅ 체크' : '❌ 해제';
  recentChanges.unshift({ itemName, label, action, time: nowStr() });
  if (recentChanges.length > 10) recentChanges.pop();
  renderRecent();
}

function renderRecent() {
  const bar = document.getElementById('recentBar');
  const list = document.getElementById('recentList');
  if (!recentChanges.length) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  list.innerHTML = recentChanges.slice(0,5).map((c,i) => `
    <div class="recent-item" onclick="scrollToItem('${c.itemName}')">
      <div class="recent-dot" style="background:${c.label==='발주요망'?'var(--need-color)':'var(--done-color)'}"></div>
      <span><b>${c.itemName}</b> ${c.label} ${c.action}</span>
      <span style="margin-left:auto;color:var(--muted);font-size:11px">${c.time}</span>
    </div>
  `).join('');
}

window.scrollToItem = function(itemName) {
  const els = document.querySelectorAll('.item-name');
  for (const el of els) {
    if (el.textContent === itemName) {
      el.closest('.item').scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.closest('.item').classList.add('highlight');
      setTimeout(() => el.closest('.item').classList.remove('highlight'), 1600);
      break;
    }
  }
  closeRecent();
}

function toggleField(key, field) {
  if (!state[key]) state[key] = { need: false, needDate: '', boss: false, bossDate: '' };
  const cur = state[key][field];
  state[key][field] = !cur;
  state[key][field+'Date'] = !cur ? todayStr() : '';
  saveToFirebase();
  render();
}

function editDate(key, dateField) {
  const cur = state[key]?.[dateField] || '';
  const val = prompt('날짜 입력 (예: 6/15)', cur);
  if (val === null) return;
  if (!state[key]) state[key] = { need: false, needDate: '', boss: false, bossDate: '' };
  state[key][dateField] = val.trim();
  saveToFirebase();
  render();
}

// Add item
window.showAddInput = function(si) {
  addingSection = si;
  render();
  setTimeout(() => document.getElementById(`add-input-${si}`)?.focus(), 100);
}

window.cancelAdd = function() {
  addingSection = null;
  render();
}

window.confirmAdd = function(si) {
  const input = document.getElementById(`add-input-${si}`);
  const name = input?.value.trim();
  if (!name) return;
  if (!sections[si].items.includes(name)) {
    sections[si].items.push(name);
    addingSection = null;
    saveToFirebase();
    render();
    showToast(`✅ "${name}" 추가됐어요!`);
  } else {
    showToast('이미 있는 항목이에요');
  }
}

window.resetAll = function() {
  if (!confirm('전체 초기화할까요?\n모든 체크가 사라져요.')) return;
  state = {};
  saveToFirebase();
  render();
}

function render() {
  const container = document.getElementById('sections');
  container.innerHTML = '';
  let totalAll = 0, needAll = 0, doneAll = 0;

  sections.forEach((section, si) => {
    let needCount = 0, bossCount = 0;
    section.items.forEach(item => {
      const key = getKey(si, item);
      if (!state[key]) state[key] = { need: false, needDate: '', boss: false, bossDate: '' };
      if (state[key].need) needCount++;
      if (state[key].boss) bossCount++;
    });
    totalAll += section.items.length;
    needAll += needCount;
    doneAll += bossCount;

    const sectionEl = document.createElement('div');
    sectionEl.className = 'section';
    sectionEl.innerHTML = `
      <div class="section-header">
        <div class="section-title">
          <div class="section-dot" style="background:${section.color}"></div>
          <div class="section-name">${section.name}</div>
        </div>
        <div class="section-count">발주요망 ${needCount} · 완료 ${bossCount}</div>
      </div>
      <div class="col-header">
        <div></div>
        <div class="col-label need-label">🔴 발주요망<br><span style="font-weight:400;font-size:10px">직원 체크</span></div>
        <div class="col-label done-label">🟢 발주완료<br><span style="font-weight:400;font-size:10px">사장님 체크</span></div>
      </div>
      <div class="card" id="card-${si}"></div>
    `;
    container.appendChild(sectionEl);

    const card = document.getElementById(`card-${si}`);

    section.items.forEach(item => {
      const key = getKey(si, item);
      const s = state[key];
      const fullyDone = s.need && s.boss;

      const el = document.createElement('div');
      el.className = 'item' + (fullyDone ? ' fully-done' : '');
      el.id = `item-${key}`;
      el.innerHTML = `
        <div class="item-name">${item}</div>
        <div class="date-cell need ${s.need ? 'active' : ''}" data-key="${key}" data-field="need">
          <div class="date-checkbox">${CHECK_SVG}</div>
          <div class="date-tag ${s.needDate ? '' : 'empty'}" data-key="${key}" data-datefield="needDate">${s.needDate || '날짜'}</div>
        </div>
        <div class="date-cell boss ${s.boss ? 'active' : ''}" data-key="${key}" data-field="boss">
          <div class="date-checkbox">${CHECK_SVG}</div>
          <div class="date-tag ${s.bossDate ? '' : 'empty'}" data-key="${key}" data-datefield="bossDate">${s.bossDate || '날짜'}</div>
        </div>
      `;

      el.querySelectorAll('.date-cell').forEach(cell => {
        cell.addEventListener('click', (e) => {
          if (e.target.classList.contains('date-tag') && !e.target.classList.contains('empty')) return;
          const k = cell.dataset.key;
          const f = cell.dataset.field;
          if (!state[k]) state[k] = { need: false, needDate: '', boss: false, bossDate: '' };
          const newVal = !state[k][f];
          state[k][f] = newVal;
          state[k][f+'Date'] = newVal ? todayStr() : '';
          saveToFirebase();
          render();
        });
      });
      el.querySelectorAll('.date-tag:not(.empty)').forEach(tag => {
        tag.addEventListener('click', (e) => {
          e.stopPropagation();
          editDate(tag.dataset.key, tag.dataset.datefield);
        });
      });

      card.appendChild(el);
    });

    // Add item row
    if (addingSection === si) {
      const inputRow = document.createElement('div');
      inputRow.className = 'add-item-input-row';
      inputRow.innerHTML = `
        <input id="add-input-${si}" class="add-item-input" type="text" placeholder="항목 이름 입력...">
        <button class="add-cancel-btn" onclick="cancelAdd()">취소</button>
        <button class="add-confirm-btn" onclick="confirmAdd(${si})">추가</button>
      `;
      // Enter key
      inputRow.querySelector('input').addEventListener('keydown', e => {
        if (e.key === 'Enter') window.confirmAdd(si);
      });
      card.appendChild(inputRow);
    } else {
      const addBtn = document.createElement('div');
      addBtn.className = 'add-item-btn';
      addBtn.innerHTML = `<span class="plus">＋</span> 항목 추가`;
      addBtn.onclick = () => window.showAddInput(si);
      card.appendChild(addBtn);
    }
  });

  document.getElementById('needCount').textContent = needAll;
  document.getElementById('doneCount').textContent = doneAll;
  document.getElementById('totalCount').textContent = totalAll;
}

// Date
const now = new Date();
document.getElementById('dateDisplay').textContent =
  `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일`;

// Firestore real-time
let prevState = {};
onSnapshot(DOC_REF, (snap) => {
  document.getElementById('loading').style.display = 'none';
  setSyncStatus('online');

  if (snap.exists()) {
    const data = snap.data();
    const newState = data.state || {};
    const newSections = data.sections || sections;

    // Detect changes (skip first load)
    if (!isFirstLoad) {
      Object.entries(newState).forEach(([key, val]) => {
        const prev = prevState[key] || {};
        ['need','boss'].forEach(field => {
          if (val[field] !== prev[field]) {
            // Find item name
            let itemName = key.split('__')[1]?.replace(/_/g,' ') || key;
            sections.forEach(sec => {
              sec.items.forEach(it => { if (getKey(sections.indexOf(sec), it) === key) itemName = it; });
            });
            addRecentChange(itemName, field, val[field]);
            const label = field === 'need' ? '🔴 발주요망' : '🟢 발주완료';
            sendNotif(`카페 발주 변경`, `${itemName} — ${label} ${val[field] ? '체크됨' : '해제됨'}`);
            showToast(`${itemName} ${label} ${val[field] ? '체크됨' : '해제됨'}`);
          }
        });
      });
    }

    prevState = JSON.parse(JSON.stringify(newState));
    state = newState;
    sections = newSections;
    isFirstLoad = false;
  } else {
    isFirstLoad = false;
  }
  render();
}, (err) => {
  document.getElementById('loading').style.display = 'none';
  setSyncStatus('offline');
  isFirstLoad = false;
  render();
});
</script>
</body>
</html>
